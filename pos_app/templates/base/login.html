<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetPOS Pro — Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
{% load static %}
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --brand-emerald: #239B72;
    --brand-emerald-hover: #1e8763;
    --brand-petroleum: #173B4D;
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* login 1: Fondo de toda la pantalla (100% viewport) */
    background: url("{% static 'img/login_1.jpg' %}") center center / cover no-repeat fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Capa de contraste cinematográfica suave */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 36, 0.45);
    backdrop-filter: blur(2px);
    z-index: 1;
    pointer-events: none;
  }

  /* ── TARJETA COMPACTA BASADA EN LOGIN 2 ── */
  .login-card-compact {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    background: url("{% static 'img/login_2.jpg' %}") center top / cover no-repeat;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.25);
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Capa interna semi-translúcida para garantizar legibilidad de campos sin tapar la tarjeta */
  .card-inner-glass {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(23, 59, 77, 0.72) 0%, rgba(15, 35, 46, 0.88) 40%, rgba(12, 28, 38, 0.94) 100%);
    backdrop-filter: blur(10px);
    padding: 34px 32px 30px;
    display: flex;
    flex-direction: column;
  }

  /* Logo e Isotipo Compactos */
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    background: var(--brand-emerald);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    box-shadow: 0 2px 8px rgba(35, 155, 114, 0.4);
  }

  .brand-icon img {
    width: 100%;
    height: 100%;
    filter: brightness(0) invert(1);
  }

  .brand-title {
    font-size: 20px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: -0.4px;
  }

  /* Alerta de Error */
  .error-alert {
    background: rgba(220, 38, 38, 0.18);
    border: 1px solid rgba(248, 113, 113, 0.4);
    color: #FECACA;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  /* Campos del Formulario */
  .input-group-custom {
    margin-bottom: 16px;
  }

  .input-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .input-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-box .prefix-icon {
    position: absolute;
    left: 14px;
    color: #94A3B8;
    font-size: 15px;
    pointer-events: none;
  }

  .input-box input {
    width: 100%;
    padding: 12px 38px 12px 38px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.94);
    color: #173B4D;
    font-weight: 500;
    transition: all 0.2s;
  }

  .input-box input:focus {
    outline: none;
    background: #FFFFFF;
    border-color: var(--brand-emerald);
    box-shadow: 0 0 0 3px rgba(35, 155, 114, 0.35);
  }

  .input-box .toggle-pwd {
    position: absolute;
    right: 14px;
    color: #64748B;
    font-size: 15px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .input-box .toggle-pwd:hover {
    color: var(--brand-emerald);
  }

  /* Botón de Inicio de Sesión */
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: var(--brand-emerald);
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(35, 155, 114, 0.35);
    transition: all 0.2s;
  }

  .btn-submit:hover {
    background: var(--brand-emerald-hover);
    box-shadow: 0 6px 18px rgba(35, 155, 114, 0.45);
    transform: translateY(-1px);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  /* Firma Discreta Alpha Web Studio */
  .signature-compact {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
  }

  .signature-compact strong {
    color: rgba(255, 255, 255, 0.85);
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .login-card-compact { max-width: 100%; }
    .card-inner-glass { padding: 28px 22px 24px; }
  }
</style>
</head>
<body>

<div class="login-card-compact">
  <div class="card-inner-glass">
    <!-- Logotipo compacto PetPOS Pro -->
    <div class="brand-header">
      <div class="brand-icon">
        <img src="{% static 'img/petpos-paw.svg' %}" alt="PetPOS Pro">
      </div>
      <div class="brand-title">PetPOS Pro</div>
    </div>

    <!-- Mensaje de Error en caso de credenciales incorrectas -->
    {% if form.errors %}
    <div class="error-alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>Usuario o contraseña incorrectos.</span>
    </div>
    {% endif %}

    <!-- Formulario de Acceso Funcional -->
    <form method="post" id="loginForm">
      {% csrf_token %}

      <div class="input-group-custom">
        <label class="input-label" for="id_username">Usuario</label>
        <div class="input-box">
          <i class="bi bi-person-fill prefix-icon"></i>
          <input type="text" name="username" id="id_username" placeholder="Usuario" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="input-group-custom">
        <label class="input-label" for="id_password">Contraseña</label>
        <div class="input-box">
          <i class="bi bi-lock-fill prefix-icon"></i>
          <input type="password" name="password" id="id_password" placeholder="Contraseña" required autocomplete="current-password">
          <i class="bi bi-eye toggle-pwd" id="pwdToggle" title="Mostrar/ocultar contraseña"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Iniciar Sesión</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <!-- Firma discreta Alpha Web Studio -->
    <div class="signature-compact">
      <img src="{% static 'img/alpha-logo.svg' %}" alt="Alpha Web Studio" width="12" height="12" style="opacity: 0.7;">
      <span>Desarrollado por <strong>Alpha Web Studio</strong></span>
    </div>
  </div>
</div>

<script>
  // Mostrar u ocultar contraseña
  const pwdInput = document.getElementById('id_password');
  const pwdToggle = document.getElementById('pwdToggle');
  
  pwdToggle.addEventListener('click', () => {
    const isPassword = pwdInput.type === 'password';
    pwdInput.type = isPassword ? 'text' : 'password';
    pwdToggle.className = isPassword ? 'bi bi-eye-slash toggle-pwd' : 'bi bi-eye toggle-pwd';
  });

  // Indicador de carga en envío de credenciales
  document.getElementById('loginForm').addEventListener('submit', () => {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Ingresando...`;
  });
</script>

</body>
</html>
